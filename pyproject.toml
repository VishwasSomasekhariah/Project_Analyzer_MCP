[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-analyzer-mcp"
version = "0.1.0"
description = "MCP server for intelligent code analysis using Code Property Graphs (CPG) and vector RAG"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "VishwasSomasekhariah" }
]
keywords = ["mcp", "code-analysis", "cpg", "rag", "graph", "neo4j", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # MCP framework
    "mcp==1.23.0",
    "fastmcp==2.3.4",
    "mcp-use==1.2.12",

    # LLM clients
    "anthropic==0.83.0",
    "openai==1.92.2",
    "claude-agent-sdk==0.2.87",

    # LangGraph / LangChain
    "langgraph==0.6.4",
    "langchain-core==0.3.74",

    # Web framework
    "fastapi==0.115.12",
    "starlette==0.46.2",
    "uvicorn==0.35.0",
    "httpx==0.28.1",

    # Data
    "pydantic==2.11.7",
    "numpy==2.3.2",
    "pandas==2.3.1",
    "openpyxl==3.1.5",
    "PyYAML==6.0.2",

    # File watching + checksum dedup
    "watchdog==6.0.0",
    "redis==6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
project-analyzer-mcp = "src:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
